<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeknikSchool</title>
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Load fonts as early as possible so text never flashes in the browser default font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&family=Poppins:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
      /* Applied instantly, before React or any component styles load —
         removes the "flash of unstyled HTML" (default serif font, white
         background, no layout) that shows on slow connections. */
      html, body {
        margin: 0;
        padding: 0;
        background: #F7F8FA;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow-x: hidden; /* belt-and-suspenders against any stray horizontal scroll */
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh; /* accounts for mobile browser toolbars; falls back to 100vh on older browsers */
      }

      /* Global responsive/accessibility tokens — apply everywhere,
         not just on pages that opt in. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }

      img, video {
        max-width: 100%;
        height: auto;
      }

      /* Visible keyboard focus everywhere — accessibility requirement,
         easy to lose track of when every component uses custom buttons. */
      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid #7C6FFF;
        outline-offset: 2px;
      }

      /* Respect the OS-level "reduce motion" accessibility setting across
         the whole app — every animation/transition anywhere collapses to
         near-instant, regardless of which component defined it. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Static, CSS-only loading screen — shows immediately, with zero
         dependency on JavaScript having loaded yet. React replaces this
         the instant it mounts, so it's only ever visible for the first
         split second (or longer on a slow connection, where it actually
         matters most). */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #F7F8FA;
        z-index: 9999;
      }
      #initial-loader img {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      #initial-loader .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #7C6FFF33;
        border-top-color: #7C6FFF;
        border-radius: 50%;
        animation: initial-spin 0.8s linear infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <img src="/logo.png" alt="TeknikSchool" />
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
